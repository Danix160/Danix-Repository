<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danix Repository • CloudStream</title>
    <meta name="description" content="Installa Danix Repository su CloudStream">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            background:
                radial-gradient(circle at top, #1d3557 0%, #121212 45%);
            color: #ffffff;
        }

        .card {
            width: 100%;
            max-width: 390px;

            padding: 30px 24px;

            text-align: center;

            background: rgba(30, 30, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;

            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        .gumball {
            width: 115px;
            max-width: 100%;
            margin-bottom: 8px;
            border-radius: 18px;
        }

        h1 {
            margin: 5px 0 4px;
            font-size: 1.65rem;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #a9a9a9;
            font-size: 0.9rem;
        }

        .status {
            display: inline-block;
            margin-bottom: 20px;
            padding: 5px 10px;

            background: rgba(76, 175, 80, 0.14);
            border: 1px solid rgba(76, 175, 80, 0.35);
            border-radius: 20px;

            color: #81c784;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .btn {
            display: block;
            width: 100%;

            padding: 15px 20px;

            background: #2196f3;
            color: #ffffff;

            border-radius: 14px;

            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;

            box-shadow: 0 7px 20px rgba(33, 150, 243, 0.25);

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .btn:hover {
            background: #42a5f5;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .manual {
            margin-top: 12px;

            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: none;

            color: #cccccc;

            cursor: pointer;
        }

        .manual:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .message {
            min-height: 20px;
            margin-top: 10px;

            color: #81c784;
            font-size: 0.78rem;
        }

        .help {
            margin: 15px 0 0;

            color: #777777;
            font-size: 0.78rem;
            line-height: 1.45;
        }

        .footer {
            margin-top: 22px;
            padding-top: 17px;

            border-top: 1px solid rgba(255, 255, 255, 0.07);

            color: #666666;
            font-size: 0.72rem;
        }

        .footer a {
            color: #8ab4f8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <img
        class="gumball"
        src="https://raw.githubusercontent.com/Danix160/Danix-Repository/master/gum.png"
        alt="Danix Repository"
    >

    <h1>Danix Repository 🇮🇹</h1>

    <p class="subtitle">
        Plugin italiani per CloudStream
    </p>

    <div class="status">
        ● Repository disponibile
    </div>

    <a
        href="cloudstreamrepo://raw.githubusercontent.com/Danix160/Danix-Repository/builds/repo.json"
        class="btn"
    >
        ☁️ INSTALLA IN CLOUDSTREAM
    </a>

    <button
        type="button"
        class="btn manual"
        onclick="copyRepo()"
    >
        📋 COPIA LINK REPOSITORY
    </button>

    <div id="message" class="message"></div>

    <p class="help">
        Se CloudStream non si apre automaticamente,
        copia il link della repository e aggiungilo
        manualmente dalle impostazioni dell'app.
    </p>

    <div class="footer">
        Danix Repository • CloudStream ITA
        <br><br>
        <a href="https://github.com/Danix160/Danix-Repository">
            GitHub Repository
        </a>
    </div>

</div>

<script>
    const repoUrl =
        "https://raw.githubusercontent.com/Danix160/Danix-Repository/builds/repo.json";

    async function copyRepo() {
        const message = document.getElementById("message");

        try {
            await navigator.clipboard.writeText(repoUrl);
            message.textContent = "✓ Link copiato negli appunti!";
        } catch (error) {
            message.textContent = "Impossibile copiare automaticamente.";

            window.prompt(
                "Copia questo link:",
                repoUrl
            );
        }
    }
</script>

</body>
</html>
