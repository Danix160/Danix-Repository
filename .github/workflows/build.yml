name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout sorgenti plugin
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          path: "src"

      # Checkout branch builds
      - name: Checkout builds branch
        uses: actions/checkout@v3
        with:
          ref: "builds"
          path: "builds"

      # Pulizia vecchi .cs3
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      # Java 17 (richiesto da Cloudstream)
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Android SDK (richiesto dal plugin Cloudstream)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      # Build plugin con il wrapper corretto (Gradle 7.6.1)
      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew

          # Build del singolo plugin
          ./gradlew clean :ToonItaliaProvider:make --stacktrace

          # Build globale + plugins.json
          ./gradlew make makePluginsJson --stacktrace

          # Copia tutti i .cs3 generati
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \;

          # Copia plugins.json
          cp build/plugins.json $GITHUB_WORKSPACE/builds/ || cp plugins.json $GITHUB_WORKSPACE/builds/ || true

      # Commit e push su branch builds
      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push --force origin builds
