name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      # Corretto: Usa Temurin e abilita il caching gestito nativamente
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          
          # FORZA LA PULIZIA DELLA CACHE GLOBALE (Risolve 'invalid tag (zero)')
          rm -rf ~/.gradle/caches/kotlin-dsl
          rm -rf ~/.gradle/caches/transforms-*
          
          # Pulizia workspace locale
          rm -rf .gradle build .kotlin
          find . -name "build" -type d -exec rm -rf {} +
          
          # Esecuzione build senza Daemon e senza Build Cache per evitare corruzioni Protobuf
          ./gradlew clean make makePluginsJson --no-daemon --no-build-cache --rerun-tasks --stacktrace
          
          # Copia gli artefatti generati (.cs3)
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          
          # Copia il manifesto dei plugin (plugins.json)
          cp build/plugins.json $GITHUB_WORKSPACE/builds/ || cp plugins.json $GITHUB_WORKSPACE/builds/ || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push --force origin builds
